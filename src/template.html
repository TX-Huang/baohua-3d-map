<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>/*__MAPDATA__*/</script>
<script>
(function () {
'use strict';

/* ====== 建築名稱：知道名字就填進來，空白就顯示「F 棟」這種代號 ======
   GLYPHS 是標籤圓圈裡的那一個字。 */
const NAMES = { A: '大木屋', B: '主殿', D: '廚房', E: '宿舍', I: '小木屋', J: '水塔', P1: '遊覽車停車場', P2: '主殿廣場' };
const GLYPHS = { A: '屋', B: '殿', D: '廚', E: '宿', I: '屋', J: '水', P1: '停', P2: '場' };
/* ====== 工作人員：每個地點負責的人，一個名字一格 ====== */
const STAFF = {
  P1: ['鉑宸', 'Chris', '黃亦修', '黃宗祥'],
  P2: ['陶明潔', '李函紋'],
  reg: ['莛茜'],
};
const MAIN_HALL = 'B';
const OPEN_SHEDS = {};     // 只有屋頂和柱子、沒有牆的鐵皮棚（目前沒有）
const NOTES = {
  A: '深灰色瓦頂、白色屋脊的長形木屋，西北端有一個淺色門廊，東側連著一間小側屋。',
  B: '園區的主殿，白色長屋頂，沿著主殿廣場的東北側。',
  D: '白色屋頂，在主殿廣場南端，再往南是宿舍。',
  E: '園區最南端的大型平頂建築，屋頂上有一間白色小屋。',
  I: '紅色屋頂、有白色條紋的長屋，在馬路南側。',
  J: '遊覽車停車場西邊的圓形水塔。',
  P1: '園區西北邊的大片水泥空地，遊覽車停這裡。南邊接華山產業道路，東北角接往山頂的路。',
  P2: '主殿和大木屋之間的鋪面廣場，中間有一棵大樹，南端接廚房。',
};
const HOME_ID = 'P2';
let needsRender = true;
let topView = false;
let photoMode = false;

const D = window.MAPDATA;
const G = D.grid, GEO = D.geo;
const COLS = G.cols, ROWS = G.rows, STEP = G.step, W = G.width, DEP = G.depth, HMIN = G.hmin;
const BASE_Y = -14;
const H = (function () {
  const bin = atob(G.b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const u16 = new Uint16Array(u8.buffer); const out = new Float32Array(u16.length);
  for (let i = 0; i < u16.length; i++) out[i] = u16[i] / 100;     // metres above HMIN
  return out;
})();
function yAt(x, z) {
  const c = Math.min(Math.max((x + W / 2) / STEP, 0), COLS - 1.001);
  const r = Math.min(Math.max((z + DEP / 2) / STEP, 0), ROWS - 1.001);
  const c0 = Math.floor(c), r0 = Math.floor(r), fc = c - c0, fr = r - r0, i = r0 * COLS + c0;
  return (H[i] * (1 - fc) + H[i + 1] * fc) * (1 - fr) + (H[i + COLS] * (1 - fc) + H[i + COLS + 1] * fc) * fr;
}

const stage = document.getElementById('stage');
const pinLayer = document.getElementById('pins');
const loading = document.getElementById('loading');
if (!window.THREE || !THREE.OrbitControls) { loading.firstElementChild.textContent = '3D 元件載入失敗，請重新整理頁面。'; return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (err) { loading.firstElementChild.textContent = '這台裝置無法顯示 3D，請改用新版 Chrome 或 Safari。'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
const fog = new THREE.Fog(0xf1f4f1, 600, 2000);
scene.fog = fog;
scene.add(new THREE.HemisphereLight(0xf3f6ff, 0x5b4a38, 0.62));
const sun = new THREE.DirectionalLight(0xfff3e0, 0.92);
sun.position.set(-300, 420, -260);      // north-west light, matches the baked shadows
scene.add(sun);
const matCache = {};
const mat = (c) => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));

/* ---------------- terrain ---------------- */
const geo = new THREE.PlaneGeometry(W, DEP, COLS - 1, ROWS - 1);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) pos.setY(i, H[i]);
geo.computeVertexNormals();

const TW = Math.min(4096, renderer.capabilities.maxTextureSize || 4096);
const texCanvas = document.createElement('canvas');
const modelTex = new THREE.CanvasTexture(texCanvas);
modelTex.encoding = THREE.sRGBEncoding;
modelTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const photoTex = new THREE.TextureLoader().load(D.photo, () => { needsRender = true; });
photoTex.encoding = THREE.sRGBEncoding;
photoTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const contourU = { value: 1 };
const terrainMat = new THREE.MeshLambertMaterial({ map: modelTex });
terrainMat.extensions = { derivatives: true };
terrainMat.onBeforeCompile = (shader) => {
  shader.uniforms.uHmin = { value: HMIN };
  shader.uniforms.uContour = contourU;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uHmin; varying float vElev;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvElev = position.y + uHmin;');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vElev; uniform float uContour;')
    .replace('#include <map_fragment>', `#include <map_fragment>
      float f5 = vElev / 5.0; float w5 = fwidth(f5);
      float d5 = min(fract(f5), 1.0 - fract(f5));
      float minor = (1.0 - smoothstep(0.0, w5 * 1.1, d5)) * (1.0 - smoothstep(0.15, 0.45, w5));
      float f25 = vElev / 25.0; float w25 = fwidth(f25);
      float d25 = min(fract(f25), 1.0 - fract(f25));
      float major = (1.0 - smoothstep(0.0, w25 * 1.5, d25)) * (1.0 - smoothstep(0.25, 0.6, w25));
      diffuseColor.rgb *= 1.0 - max(minor * 0.12, major * 0.26) * uContour;`);
};
const terrain = new THREE.Mesh(geo, terrainMat);
scene.add(terrain);

(function buildBlock() {
  const edges = [[], [], [], []];
  for (let c = 0; c < COLS; c++) edges[0].push([c, 0]);
  for (let r = 0; r < ROWS; r++) edges[1].push([COLS - 1, r]);
  for (let c = COLS - 1; c >= 0; c--) edges[2].push([c, ROWS - 1]);
  for (let r = ROWS - 1; r >= 0; r--) edges[3].push([0, r]);
  const P = [];
  for (const e of edges) for (let k = 0; k < e.length - 1; k++) {
    const [c1, r1] = e[k], [c2, r2] = e[k + 1];
    const x1 = -W / 2 + c1 * STEP, z1 = -DEP / 2 + r1 * STEP, y1 = H[r1 * COLS + c1];
    const x2 = -W / 2 + c2 * STEP, z2 = -DEP / 2 + r2 * STEP, y2 = H[r2 * COLS + c2];
    P.push(x1, y1, z1, x1, BASE_Y, z1, x2, y2, z2, x2, y2, z2, x1, BASE_Y, z1, x2, BASE_Y, z2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x6b5843, side: THREE.DoubleSide })));
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(W, DEP).rotateX(Math.PI / 2), mat(0x4a3c2e));
  plate.position.y = BASE_Y; scene.add(plate);
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const cg = c.getContext('2d'); const grd = cg.createRadialGradient(128, 128, 30, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.28)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  cg.fillStyle = grd; cg.fillRect(0, 0, 256, 256);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.6, DEP * 1.7).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sh.position.y = BASE_Y - 25; scene.add(sh);
})();

/* ---------------- buildings ---------------- */
function gableGeometry(L, Wd, rh) {
  const a = [-L / 2, 0, -Wd / 2], b = [L / 2, 0, -Wd / 2], c = [L / 2, 0, Wd / 2], d = [-L / 2, 0, Wd / 2];
  const r0 = [-L / 2, rh, 0], r1 = [L / 2, rh, 0];
  const tris = [a, r1, b, a, r0, r1, d, c, r1, d, r1, r0, a, d, r0, b, r1, c, a, b, c, a, c, d];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
}
const tops = {};
for (const b of D.buildings) {
  const grp = new THREE.Group();
  const y0 = b.y - HMIN;
  if (OPEN_SHEDS[b.group]) {
    // steel-frame shed: a concrete slab, posts every ~4 m along both long sides, no walls
    const slab = new THREE.Mesh(new THREE.BoxGeometry(b.L, 2, b.W), mat('#cfc9bc'));
    slab.position.y = y0 - 0.95; grp.add(slab);
    const n = Math.max(2, Math.round(b.L / 4) + 1);
    for (let k = 0; k < n; k++) for (const s of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, b.h, 0.22), mat('#7d8285'));
      post.position.set(-b.L / 2 + 0.3 + k * (b.L - 0.6) / (n - 1), y0 + b.h / 2, s * (b.W / 2 - 0.3));
      grp.add(post);
    }
  } else {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(b.L, b.h + 2, b.W), mat(b.wc));
    wall.position.y = y0 + (b.h - 2) / 2;
    grp.add(wall);
  }
  if (b.roof === 'gable') {
    const ov = 0.6;
    const roof = new THREE.Mesh(gableGeometry(b.L + ov * 2, b.W + ov * 2, b.rh), mat(b.rc));
    roof.position.y = y0 + b.h; grp.add(roof);
    if (b.ridge) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(b.L + ov * 2 + 0.2, 0.45, 0.7), mat(b.ridge));
      ridge.position.y = y0 + b.h + b.rh; grp.add(ridge);
    }
    if (b.stripes) {
      for (let k = 0; k < b.stripes; k++) {
        const t = -b.L / 2 + (k + 0.5) * b.L / b.stripes;
        for (const s of [-1, 1]) {
          const slope = Math.atan2(b.rh, (b.W + ov * 2) / 2);
          const strip = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, (b.W + ov * 2) / 2 / Math.cos(slope)), mat('#efece6'));
          strip.position.set(t, y0 + b.h + b.rh / 2 + 0.06, s * (b.W + ov * 2) / 4);
          strip.rotation.x = s * slope;
          grp.add(strip);
        }
      }
    }
  } else {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(b.L + 0.3, 0.4, b.W + 0.3), mat(b.rc));
    cap.position.y = y0 + b.h + 0.2; grp.add(cap);
  }
  grp.position.set(b.cx, 0, b.cz);
  grp.rotation.y = -b.a;
  scene.add(grp);
  const top = y0 + b.h + (b.rh || 0.4);
  if (!tops[b.group] || b.id === b.group) tops[b.group] = { x: b.cx, z: b.cz, y: top, b };
}
(function waterTank() {
  // round tank on a low plinth with a shallow conical lid (dark lid seen in the aerial photo)
  const p = D.pavilion, y0 = p.y - HMIN, grp = new THREE.Group();
  const tankH = 4.5, lidH = 1.1;
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(p.r + 0.6, p.r + 0.6, 2, 24), mat('#cfc9bc'));
  plinth.position.y = y0 - 0.6; grp.add(plinth);
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(p.r, p.r, tankH, 32), mat('#8f9a96'));
  tank.position.y = y0 + 0.4 + tankH / 2; grp.add(tank);
  for (const h of [1.4, 2.9]) {
    const band = new THREE.Mesh(new THREE.CylinderGeometry(p.r + 0.05, p.r + 0.05, 0.18, 32), mat('#6f7a77'));
    band.position.y = y0 + 0.4 + h; grp.add(band);
  }
  const lid = new THREE.Mesh(new THREE.ConeGeometry(p.r + 0.15, lidH, 32), mat(p.rc));
  lid.position.y = y0 + 0.4 + tankH + lidH / 2; grp.add(lid);
  grp.position.set(p.cx, 0, p.cz); scene.add(grp);
  tops.J = { x: p.cx, z: p.cz, y: y0 + 0.4 + tankH + lidH, b: { L: p.r * 2, W: p.r * 2, y: p.y, round: true } };
})();
for (const c of D.cars) {
  const grp = new THREE.Group(), y0 = c.y - HMIN;
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.9, 1.75), mat(c.c)); body.position.y = y0 + 0.75; grp.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.7, 1.55), mat('#3b4248')); cab.position.set(-0.2, y0 + 1.5, 0); grp.add(cab);
  grp.position.set(c.x, 0, c.z); grp.rotation.y = -(Math.PI * 0.73); scene.add(grp);
}

/* ---------------- event furniture ---------------- */
// 登記處: one table with a red cloth and two chairs, in front of the main hall's end wall
// that faces the road, where the road enters the plaza.
const EVENT_SPOTS = [];
(function registrationDesk() {
  const b = D.buildings.find(o => o.id === MAIN_HALL);
  const road = D.roads.find(r => r.id === 'main');
  if (!b || !road) return;
  const n = road.p.length, rx = road.p[n - 2], rz = road.p[n - 1];
  const ux = Math.cos(b.a), uz = Math.sin(b.a);
  const ends = [1, -1].map(s => ({ s, x: b.cx + s * ux * b.L / 2, z: b.cz + s * uz * b.L / 2 }));
  const end = ends.sort((p, q) => Math.hypot(p.x - rx, p.z - rz) - Math.hypot(q.x - rx, q.z - rz))[0];
  const out = 3.2;                                   // metres in front of the wall
  const x = end.x + end.s * ux * out, z = end.z + end.s * uz * out, y0 = yAt(x, z);
  const grp = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.76, 0.75), mat('#b5361e'));   // table under a red cloth
  top.position.y = y0 + 0.38; grp.add(top);
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.04, 0.79), mat('#f3efe6'));
  board.position.y = y0 + 0.78; grp.add(board);
  for (const s of [-0.45, 0.45]) {
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), mat('#3d4246'));
    seat.position.set(s, y0 + 0.23, -end.s * 0.75); grp.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.06), mat('#3d4246'));
    back.position.set(s, y0 + 0.7, -end.s * 0.95); grp.add(back);
  }
  grp.position.set(x, 0, z);
  grp.rotation.y = -b.a;            // table's long side runs along the end wall
  grp.rotateY(Math.PI / 2);
  scene.add(grp);
  EVENT_SPOTS.push({ id: 'reg', kind: 'checkin', name: '登記處', glyph: '登', x, z, y: y0 + 1.2, near: true,
