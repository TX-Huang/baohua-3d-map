<style>
/* Layout: the terrain is a floating relief model (沙盤) filling the screen; a temple-plaque title sits top-left,
   view tools top-right, and a bottom tray holds the place list and the selected place's card. */
:root {
  --sky-1: #d6e2e0;
  --sky-2: #f1f4f1;
  --ink: #1c2a2b;
  --muted: #566664;
  --panel: rgba(249, 251, 249, 0.96);
  --panel-solid: #f9fbf9;
  --line: rgba(28, 42, 43, 0.14);
  --shadow: 0 6px 24px rgba(20, 35, 35, 0.16), 0 1px 3px rgba(20, 35, 35, 0.12);
  --cinnabar: #b5361e;   /* 朱砂: temples, primary action */
  --gold: #9a6f12;       /* 金: check-in, ceremony */
  --jade: #2e6b5a;       /* 山林: landmarks, peaks */
  --indigo: #2c5c8f;     /* 停車 */
  --plum: #7a3f73;       /* 活動 / 舞台 */
  --on-pin: #ffffff;
  --focus: #1f6fb2;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "STKaiti", "DFKai-SB", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-1: #0d1619; --sky-2: #19272a; --ink: #e3ece9; --muted: #9db0ac;
    --panel: rgba(17, 26, 28, 0.95); --panel-solid: #141f22; --line: rgba(227, 236, 233, 0.14);
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.4);
    --cinnabar: #e0583b; --gold: #d3a443; --jade: #5fb89c; --indigo: #6fa3dc; --plum: #c07bb8;
    --focus: #7db7ea; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-1: #0d1619; --sky-2: #19272a; --ink: #e3ece9; --muted: #9db0ac;
  --panel: rgba(17, 26, 28, 0.95); --panel-solid: #141f22; --line: rgba(227, 236, 233, 0.14);
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.4);
  --cinnabar: #e0583b; --gold: #d3a443; --jade: #5fb89c; --indigo: #6fa3dc; --plum: #c07bb8;
  --focus: #7db7ea; color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--sky-2); color: var(--ink); font-family: var(--font-body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 62%); }
#stage canvas { display: block; touch-action: none; outline: none; }
#pins { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

/* ---------- pins ---------- */
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer; }
.pin-body { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: transform .18s ease; transform-origin: 50% 100%; }
.pin-tag { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--panel-solid); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.glyph { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--pin); color: var(--on-pin); font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1; }
.pin-stem { width: 2px; height: 22px; background: var(--pin); }
.pin-foot { width: 9px; height: 9px; margin-bottom: -4.5px; border-radius: 50%; background: var(--pin); box-shadow: 0 0 0 3px var(--panel-solid); }
.pin:hover .pin-body, .pin:focus-visible .pin-body { transform: translateX(-50%) scale(1.06); }
.pin.is-active .pin-body { transform: translateX(-50%) scale(1.12); }
.pin.is-active .pin-tag { background: var(--pin); color: var(--on-pin); }
.pin.is-active .glyph { background: var(--on-pin); color: var(--pin); }
.pins-dim .pin:not(.is-active) { opacity: .55; }

.t-temple { --pin: var(--cinnabar); }
.t-landmark, .t-peak { --pin: var(--jade); }
.t-checkin, .t-ceremony { --pin: var(--gold); }
.t-parking { --pin: var(--indigo); }
.t-toilet, .t-medical { --pin: var(--indigo); }
.t-food, .t-stage, .t-booth { --pin: var(--plum); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 10px; }
.hud > * { pointer-events: auto; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud-top > * { pointer-events: auto; }

.plaque { display: flex; align-items: stretch; gap: 12px; padding: 10px 16px 10px 10px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.seal { flex: none; width: 46px; display: grid; place-items: center; border-radius: 6px; background: var(--cinnabar); color: var(--on-pin); font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.05; writing-mode: vertical-rl; letter-spacing: .08em; padding-block: 6px; }
.plaque-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.eyebrow { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.plaque h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(21px, 5.4vw, 28px); line-height: 1.15; letter-spacing: .04em; text-wrap: balance; }
.plaque .sub { margin: 0; font-size: 12.5px; color: var(--muted); }

.tools { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tool:hover { border-color: var(--muted); }
.tool svg { width: 16px; height: 16px; flex: none; }
.compass { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
.compass svg { width: 30px; height: 30px; transition: none; }

.tray { justify-self: center; width: min(100%, 680px); min-width: 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.tray > * { pointer-events: auto; }
.card { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 14px; display: grid; gap: 8px; }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-head .glyph { width: 30px; height: 30px; font-size: 16px; margin-top: 2px; }
.card-title { flex: 1; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: .03em; }
.card .meta { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .note { margin: 0; font-size: 14.5px; line-height: 1.65; max-width: 62ch; }
.close { flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.close:hover { background: var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
.btn.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--on-pin); }
.btn svg { width: 14px; height: 14px; }

.places { min-width: 0; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; padding: 2px; }
.chip { flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 5px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip.is-active { background: var(--pin); border-color: var(--pin); color: var(--on-pin); }
.chip.is-active .glyph { background: var(--on-pin); color: var(--pin); }
.chip-group { flex: none; align-self: center; font-size: 11px; letter-spacing: .12em; color: var(--muted); padding: 0 4px 0 6px; }
.chip.pending { border-style: dashed; color: var(--muted); cursor: default; padding-left: 12px; }
.foot { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; padding: 6px 6px 0; font-size: 11px; color: var(--muted); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.overlay p { margin: 0; padding: 10px 16px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); font-size: 14px; }

@media (max-width: 520px) {
  .plaque { padding: 8px 12px 8px 8px; gap: 10px; }
  .seal { width: 38px; font-size: 15px; }
  .tool .tool-label { display: none; }
  .tool { width: 40px; height: 40px; padding: 0; justify-content: center; }
  .compass { width: 44px; height: 44px; }
  .card .note { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .pin-body { transition: none; } }
</style>

<style>
/* close-up additions */
/* the empty middle row of the HUD must let drags and wheel through to the map */
.hud > .hud-gap { pointer-events: none; }
.t-hall { --pin: var(--cinnabar); }
.t-bldg { --pin: var(--indigo); }
.t-plaza { --pin: var(--jade); }
.pin.compact .pin-tag { padding: 3px; }
.pin.compact .pin-name { display: none; }
.pin.compact.is-active .pin-tag { padding-right: 10px; }
.pin.compact.is-active .pin-name { display: inline; }
.pin-stem { height: 16px; }
.glyph.letter { font-family: var(--font-body); font-size: 12.5px; }
.card-head .glyph.letter { font-size: 15px; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); border-color: var(--ink); }
.card .todo { color: var(--muted); font-size: 13px; margin: 0; }
.staff { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.staff-label { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.staff-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.staff-list li { padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; line-height: 1.5; }
</style>

<script>

  const bin = atob(G.b64); const u8 = new Uint8Array(bin.length);

  const u16 = new Uint16Array(u8.buffer); const out = new Float32Array(u16.length);

function paintModel() {
  const TH = Math.round(TW * DEP / W), ppm = TW / W;
  texCanvas.width = TW; texCanvas.height = TH;
  const g = texCanvas.getContext('2d');
  const X = (x) => (x + W / 2) * ppm, Y = (z) => (z + DEP / 2) * ppm;
  const path = (p, close) => { g.beginPath(); for (let i = 0; i < p.length; i += 2) { const x = X(p[i]), y = Y(p[i + 1]); i ? g.lineTo(x, y) : g.moveTo(x, y); } if (close) g.closePath(); };
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const grain = (lo, hi) => {
    const n = document.createElement('canvas'); n.width = n.height = 128;
    const ng = n.getContext('2d'); const d = ng.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) { const v = lo + rnd() * (hi - lo); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    ng.putImageData(d, 0, 0); return g.createPattern(n, 'repeat');
  };
  const multiplyGrain = (pat, alpha) => { g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = alpha; g.fillStyle = pat; g.fillRect(0, 0, TW, TH); g.restore(); };

  // forest floor
  g.fillStyle = '#577b48'; g.fillRect(0, 0, TW, TH);
  multiplyGrain(grain(170, 255), 0.5);
  // grass and scrub
  g.save(); g.filter = 'blur(6px)';
  for (const p of D.grass) { path(p, true); g.fillStyle = '#95b06c'; g.fill(); }
  g.restore();
  // plazas, plus paved patches without a label
  const pavedAreas = D.plazas.concat((D.paved || []).map(p => ({ p })));
  // kerb outlines first, then every fill on top: overlapping areas merge without inner lines
  for (const pl of pavedAreas) { path(pl.p, true); g.lineWidth = 0.9 * ppm; g.strokeStyle = '#b9b3a6'; g.stroke(); }
  for (const pl of pavedAreas) { path(pl.p, true); g.fillStyle = '#d3cec3'; g.fill(); }
  g.save();
  for (const pl of D.plazas) { path(pl.p, true); g.clip(); }
  g.restore();
  for (const pl of pavedAreas) {
    g.save(); path(pl.p, true); g.clip();
    g.strokeStyle = 'rgba(150,143,128,0.35)'; g.lineWidth = Math.max(1, 0.12 * ppm);
    g.translate(TW / 2, TH / 2); g.rotate(-0.7);
    for (let k = -TW; k < TW; k += 4 * ppm) { g.beginPath(); g.moveTo(k, -TW); g.lineTo(k, TW); g.stroke(); g.beginPath(); g.moveTo(-TW, k); g.lineTo(TW, k); g.stroke(); }
    g.restore();
  }
  // roads
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const r of D.roads) { path(r.p); g.strokeStyle = r.kind === 'asphalt' ? '#d9d4c7' : '#a8a293'; g.lineWidth = (r.w + 1.0) * ppm; g.stroke(); }
  const main = D.roads.find(r => r.id === 'main');
  if (main) { // yellow-painted kerb along the hairpin by the temple, as in the aerial photo
    const k = main.p.length; const sub = main.p.slice(k - 14);
    path(sub); g.strokeStyle = '#e1b83a'; g.lineWidth = (main.w + 0.9) * ppm; g.stroke();
  }
  for (const r of D.roads) { path(r.p); g.strokeStyle = r.kind === 'asphalt' ? '#8b8c87' : '#c4beb0'; g.lineWidth = r.w * ppm; g.stroke(); }
  multiplyGrain(grain(215, 255), 0.25);

  // soft shadows (light from the north-west, so shadows fall south-east)
  const soft = (x, z, rx, alpha) => {
    const cx = X(x), cy = Y(z), R = rx * ppm;
    const grd = g.createRadialGradient(cx, cy, R * 0.15, cx, cy, R);
    grd.addColorStop(0, `rgba(20,35,20,${alpha})`); grd.addColorStop(1, 'rgba(20,35,20,0)');
    g.fillStyle = grd; g.fillRect(cx - R, cy - R, R * 2, R * 2);
  };
  for (const [x, z, r, hf] of D.trees) soft(x + r * 0.55, z + r * 0.55, r * 1.35, 0.32 * Math.min(hf, 1.1));
  for (const b of D.buildings) {
    const k = (b.h + (b.rh || 0)) * 0.55;
    for (let s = 1; s <= 6; s++) {

    }
  }
  { const p = D.pavilion; soft(p.cx + 2, p.cz + 2, p.r * 1.6, 0.35); }

  // building footprints (visible at the eaves)
  for (const b of D.buildings) { path(b.p, true); g.fillStyle = '#bdb5a5'; g.fill(); }

  // labels painted on the ground
  const label = (text, x, z, ang, size, color, weight = 500) => {
    g.save(); g.translate(X(x), Y(z)); g.rotate(ang);
    g.font = `${weight} ${size * ppm}px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = size * ppm * 0.22; g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineJoin = 'round';
    g.strokeText(text, 0, 0); g.fillStyle = color; g.fillText(text, 0, 0); g.restore();

  const alongRoad = (r, frac, text, size, color, shift) => {
    const p = r.p; let len = 0; const segs = [];

  { const x0 = -W / 2 + 6, z0 = DEP / 2 - 6, seg = 10;

    g.textAlign = 'left'; g.fillText('0', X(x0), Y(z0) - 1.0 * ppm);
    g.textAlign = 'right'; g.fillText('50 公尺', X(x0 + 5 * seg), Y(z0) - 1.0 * ppm);

for (const s of EVENT_SPOTS) {
  Object.assign(s, { isBldg: false, named: true, letterGlyph: false, isEvent: true,
    lon: GEO.lon0 + s.x / GEO.mLon, lat: GEO.lat0 - s.z / GEO.mLat });
  POINTS.push(s);
}
const byId = Object.fromEntries(POINTS.map(p => [p.id, p]));

/* ---------------- camera ---------------- */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.rotateSpeed = 0.75;
controls.minDistance = 25; controls.maxDistance = 900;
controls.maxPolarAngle = THREE.MathUtils.degToRad(78);
controls.screenSpacePanning = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
const deg = THREE.MathUtils.degToRad;
const offsetFor = (d, polar, az) => new THREE.Vector3(d * Math.sin(polar) * Math.sin(az), d * Math.cos(polar), d * Math.sin(polar) * Math.cos(az));
const homeTarget = (() => {      // middle of everything that is labelled
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, y = 0;
  for (const p of POINTS) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); y += p.y; }
  return new THREE.Vector3((x0 + x1) / 2, y / POINTS.length - 6, (z0 + z1) / 2);
})();
const HOME = { target: homeTarget, dist: 330, polar: deg(48), az: deg(-10) };
function setView(v) { controls.target.copy(v.target); camera.position.copy(v.target).add(offsetFor(v.dist, v.polar, v.az)); controls.update(); }
setView(HOME);

let tween = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* View changes travel along the orbit (angle, tilt, log-distance), not in a straight line,
   so switching to top view or jumping to a place never dips toward the ground or bounces in and out. */
function flyTo(target, offset, ms = 1000) {
  zoomGoal = null;
  if (reduceMotion) { controls.target.copy(target); camera.position.copy(target).add(offset); controls.update(); needsRender = true; return; }
  const from = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const to = new THREE.Spherical().setFromVector3(offset);
  let dTheta = to.theta - from.theta; dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
  tween = { t0: null, ms, fromT: controls.target.clone(), toT: target.clone(),
            r0: Math.log(from.radius), r1: Math.log(to.radius), p0: from.phi, p1: to.phi, th0: from.theta, th1: from.theta + dTheta };
}
const tmpS = new THREE.Spherical(), tmpV = new THREE.Vector3();
function stepTween(now) {
  if (!tween) return false;
  if (tween.t0 === null) tween.t0 = now;
  const t = Math.min((now - tween.t0) / tween.ms, 1);
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  controls.target.lerpVectors(tween.fromT, tween.toT, e);
  tmpS.set(Math.exp(tween.r0 + (tween.r1 - tween.r0) * e), tween.p0 + (tween.p1 - tween.p0) * e, tween.th0 + (tween.th1 - tween.th0) * e);
  camera.position.copy(controls.target).add(tmpV.setFromSpherical(tmpS));
  if (t >= 1) tween = null;
  return true;
}
controls.addEventListener('start', () => { tween = null; });

/* Smooth wheel / trackpad zoom toward the point under the cursor.
   (The stock control zooms a fixed 5% per wheel event, which is jumpy with a mouse and far too fast on a trackpad.) */
let zoomGoal = null;
const zoomAnchor = new THREE.Vector3();
const zoomRay = new THREE.Raycaster(), zoomNdc = new THREE.Vector2(), zoomPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function onWheel(e) {
  e.preventDefault(); e.stopPropagation();
  tween = null;
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const k = e.ctrlKey ? 0.012 : 0.0016;          // trackpad pinch arrives as ctrl + small wheel deltas
  const cur = zoomGoal ?? camera.position.distanceTo(controls.target);
  zoomGoal = THREE.MathUtils.clamp(cur * Math.exp(dy * k), controls.minDistance, controls.maxDistance);
  const rect = renderer.domElement.getBoundingClientRect();
  zoomNdc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  camera.updateMatrixWorld();
  zoomRay.setFromCamera(zoomNdc, camera);
  zoomPlane.constant = -controls.target.y;
  if (!zoomRay.ray.intersectPlane(zoomPlane, zoomAnchor)) zoomAnchor.copy(controls.target);
  zoomAnchor.x = Math.min(Math.max(zoomAnchor.x, -W / 2), W / 2);
  zoomAnchor.z = Math.min(Math.max(zoomAnchor.z, -DEP / 2), DEP / 2);
  needsRender = true;
}
for (const el of [stage, pinLayer]) el.addEventListener('wheel', onWheel, { capture: true, passive: false });
const zoomOff = new THREE.Vector3();
function stepZoom(dt) {
  if (zoomGoal === null) return false;
  zoomOff.copy(camera.position).sub(controls.target);
  const r = zoomOff.length();
  const a = 1 - Math.exp(-dt * 13);
  const nr = Math.exp(Math.log(r) + (Math.log(zoomGoal) - Math.log(r)) * a);
  const s = nr / r;
  // scale camera and target about the anchor, so the ground under the cursor stays put
  controls.target.sub(zoomAnchor).multiplyScalar(s).add(zoomAnchor);
  camera.position.copy(controls.target).add(zoomOff.multiplyScalar(s));
  if (Math.abs(zoomGoal - nr) < nr * 0.001) zoomGoal = null;
  return true;
}
controls.addEventListener('change', () => {
  const t = controls.target;
  const cx = Math.min(Math.max(t.x, -W / 2), W / 2), cz = Math.min(Math.max(t.z, -DEP / 2), DEP / 2);
  if (cx !== t.x || cz !== t.z) { camera.position.x += cx - t.x; camera.position.z += cz - t.z; t.x = cx; t.z = cz; }
  needsRender = true;
});

/* ---------------- pins, chips, card ---------------- */
const pinEls = new Map();
const chipsEl = document.getElementById('chips');
let activeId = null;
function glyphSpan(p) { const s = document.createElement('span'); s.className = 'glyph' + (p.letterGlyph ? ' letter' : ''); s.textContent = p.glyph; s.setAttribute('aria-hidden', 'true'); return s; }
for (const p of POINTS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = `pin t-${p.kind}` + (p.isBldg && !p.named ? ' compact' : ''); b.setAttribute('aria-label', p.name);
  const body = document.createElement('span'); body.className = 'pin-body';
  const tag = document.createElement('span'); tag.className = 'pin-tag';
  tag.append(glyphSpan(p), Object.assign(document.createElement('span'), { className: 'pin-name', textContent: p.name }));
  body.append(tag, Object.assign(document.createElement('span'), { className: 'pin-stem' }), Object.assign(document.createElement('span'), { className: 'pin-foot' }));
  b.append(body);
  b.addEventListener('click', () => select(p.id));
  pinLayer.append(b); pinEls.set(p.id, b);
}
function addGroup(label) { const s = document.createElement('span'); s.className = 'chip-group'; s.textContent = label; chipsEl.append(s); }
function addChip(p) {
  const c = document.createElement('button'); c.type = 'button'; c.className = `chip t-${p.kind}`; c.dataset.id = p.id;
  c.append(glyphSpan(p), document.createTextNode(p.name)); c.addEventListener('click', () => select(p.id)); chipsEl.append(c);
}
const rank = (p) => (p.kind === 'hall' ? 0 : p.named ? 1 : 2);
if (EVENT_SPOTS.length) { addGroup('活動'); EVENT_SPOTS.forEach(addChip); }
addGroup('建築'); POINTS.filter(p => p.isBldg).sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id)).forEach(addChip);
addGroup('廣場'); POINTS.filter(p => !p.isBldg && !p.isEvent).forEach(addChip);

const card = document.getElementById('card');
const cardGlyph = document.getElementById('cardGlyph');
function select(id) {
  const p = byId[id]; if (!p) return;
  activeId = id;
  pinLayer.classList.add('pins-dim');
  for (const [k, el] of pinEls) el.classList.toggle('is-active', k === id);
  for (const c of chipsEl.querySelectorAll('.chip[data-id]')) c.classList.toggle('is-active', c.dataset.id === id);
  const chip = chipsEl.querySelector(`.chip[data-id="${id}"]`);
  if (chip) chip.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  cardGlyph.className = `glyph t-${p.kind}` + (p.letterGlyph ? ' letter' : ''); cardGlyph.textContent = p.glyph;
  document.getElementById('cardName').textContent = p.name;
  const bits = [p.isEvent ? '活動' : p.isBldg ? '建築' : '廣場'];
  if (p.isBldg && p.named) bits.push(`代號 ${p.id}`);
  if (p.size) bits.push(p.size);
  bits.push(`海拔約 ${p.elev} 公尺`);
  document.getElementById('cardMeta').textContent = bits.join(' · ');
  document.getElementById('cardNote').textContent = p.note;
  document.getElementById('cardTodo').hidden = p.named;
  const staff = STAFF[p.id] || [];
  const staffList = document.getElementById('cardStaffList');
  staffList.replaceChildren(...staff.map(n => Object.assign(document.createElement('li'), { textContent: n })));
  document.getElementById('cardStaff').hidden = staff.length === 0;
  card.hidden = false;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const dist = p.near ? Math.min(Math.max(sph.radius, 26), 38) : Math.min(Math.max(sph.radius, 70), 130);
  const polar = topView ? 0.001 : Math.min(Math.max(sph.phi, deg(40)), deg(62));
  const theta = p.viewDir && !topView ? Math.atan2(p.viewDir[0], p.viewDir[1]) : sph.theta;
  flyTo(new THREE.Vector3(p.x, p.y - (p.near ? 1 : 2), p.z), offsetFor(dist, polar, theta));
  needsRender = true;
}
function deselect() {
  activeId = null; card.hidden = true; pinLayer.classList.remove('pins-dim');
  for (const el of pinEls.values()) el.classList.remove('is-active');
  for (const c of chipsEl.querySelectorAll('.chip')) c.classList.remove('is-active');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
document.getElementById('cardClose').addEventListener('click', deselect);

/* tools */
const viewBtn = document.getElementById('viewToggle');
function setTop(on) {
  topView = on; viewBtn.setAttribute('aria-pressed', String(on));
}
viewBtn.addEventListener('click', () => {
  setTop(!topView);
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  flyTo(controls.target.clone(), offsetFor(topView ? Math.max(sph.radius, 260) : sph.radius, topView ? 0.001 : deg(55), topView ? 0 : sph.theta));
});
const photoBtn = document.getElementById('photoToggle');
photoBtn.addEventListener('click', () => {
  photoMode = !photoMode;
  photoBtn.setAttribute('aria-pressed', String(photoMode));
  terrainMat.map = photoMode ? photoTex : modelTex;
  terrainMat.needsUpdate = true;
  contourU.value = photoMode ? 0 : 1;
  trees.visible = !photoMode;
  needsRender = true;
});
document.getElementById('homeBtn').addEventListener('click', () => { setTop(false); flyTo(HOME.target.clone(), offsetFor(HOME.dist, HOME.polar, HOME.az)); });
document.getElementById('compass').addEventListener('click', () => {
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  flyTo(controls.target.clone(), offsetFor(sph.radius, sph.phi, 0), 700);
});
const needle = document.getElementById('needle');
const coarse = window.matchMedia('(pointer: coarse)').matches;
document.getElementById('hint').textContent = coarse ? '單指拖曳旋轉 · 雙指縮放、平移 · 點字母看說明' : '左鍵拖曳旋轉 · 右鍵平移 · 滾輪縮放 · 點字母看說明';

function applyTheme() { fog.color.set(getComputedStyle(document.documentElement).getPropertyValue('--sky-2').trim() || '#f1f4f1'); needsRender = true; }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------------- render loop ---------------- */
const v = new THREE.Vector3();
function placePins() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const p of POINTS) {
    const el = pinEls.get(p.id);
    v.set(p.x, p.y, p.z).project(camera);
    const vis = v.z < 1 && v.x > -1.15 && v.x < 1.15 && v.y > -1.15 && v.y < 1.25;
    if (el.hidden === vis) el.hidden = !vis;
    if (!vis) continue;
    el.style.transform = `translate3d(${((v.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v.y) / 2 * h).toFixed(1)}px, 0)`;
    const d = camera.position.distanceTo(v.set(p.x, p.y, p.z));
    const zi = String(p.id === activeId ? 100000 : 50000 - Math.round(d));
    if (el.style.zIndex !== zi) el.style.zIndex = zi;
  }
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  camera.aspect = w / Math.max(h, 1); camera.fov = w < h ? 52 : 40; camera.updateProjectionMatrix();
  needsRender = true;
}
new ResizeObserver(resize).observe(stage);
resize(); applyTheme();
/* Adaptive sharpness: if a device can't keep up while the view is moving, render fewer pixels. */
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
const frameGaps = [];
let lastTick = null, lastDrawn = false;
function adapt(gap) {
  frameGaps.push(gap);
  if (frameGaps.length < 40) return;
  const sorted = frameGaps.slice().sort((a, b) => a - b); frameGaps.length = 0;
  if (sorted[20] > 26 && pixelRatio > 1) {
    pixelRatio = Math.max(1, pixelRatio - 0.25);
    renderer.setPixelRatio(pixelRatio); resize();
  }
}
function tick(now) {
  const dt = lastTick === null ? 1 / 60 : Math.min((now - lastTick) / 1000, 0.05);
  const gap = lastTick === null ? 0 : now - lastTick;
  lastTick = now;
  const tw = stepTween(now), zm = stepZoom(dt), moved = controls.update();
  if (tw || zm || moved || needsRender) {
    if (lastDrawn && gap > 0) adapt(gap);
    const dist = camera.position.distanceTo(controls.target);
    fog.near = dist * 1.6; fog.far = dist * 5;
    renderer.render(scene, camera);
    placePins();
    needle.style.transform = `rotate(${controls.getAzimuthalAngle()}rad)`;
    needsRender = false;
    lastDrawn = true;
  } else lastDrawn = false;
}
function loop(now) { requestAnimationFrame(loop); tick(now); }
const fontsReady = Promise.race([
  document.fonts.load('500 30px "Noto Sans TC"', '華山產業道路往寶華頂牌樓下公尺0510'),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {});
if (/[?&]debug\b/.test(location.search)) window.__map = { renderer, scene, camera, controls, placePins, tick };
paintModel();
loading.hidden = true;
requestAnimationFrame(loop);
fontsReady.then(() => paintModel());
const hashId = decodeURIComponent((location.hash || '').slice(1));
if (byId[hashId]) setTimeout(() => select(hashId), 300);
window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (byId[id] && id !== activeId) select(id); });
})();
</script>
</body>
</html>
